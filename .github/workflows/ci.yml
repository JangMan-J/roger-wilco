# CI for roger-wilco. Also callable as the release gate (see release.yml).
#
# The native-Pi tests run against the real Pi runtime. There is no Pi source
# checkout in this repo, so CI downloads the supported Pi release tarballs
# from npm and presents them to scripts/link-sdk.mjs as the SDK directory,
# exactly like a local ~/pi checkout. One probe that needs Pi *source*
# (test/protocol/push-receipt-probe) no-ops against a built SDK.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Supported Pi build; keep in step with README "Requirements".
  PI_VERSION: "1.2.0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: test/host/fencing reads the pre-contract protocol from
      # an old commit with git show.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The coexistence test loads the real pi-webtasks extension beside this
      # package. It is a public repo; no token needed.
      - uses: actions/checkout@v4
        with:
          repository: JangMan-J/pi-webtasks
          path: .ci/pi-webtasks

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Restore Pi SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .ci/sdk
          key: pi-sdk-${{ env.PI_VERSION }}-v1

      - name: Build Pi SDK directory from npm tarballs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/sdk/coding-agent .ci/sdk/ai /tmp/pi-tgz
          npm pack "@earendil-works/pi-coding-agent@$PI_VERSION" "@earendil-works/pi-ai@$PI_VERSION" \
            --pack-destination /tmp/pi-tgz --silent
          tar xzf "/tmp/pi-tgz/earendil-works-pi-coding-agent-$PI_VERSION.tgz" -C .ci/sdk/coding-agent --strip-components=1
          tar xzf "/tmp/pi-tgz/earendil-works-pi-ai-$PI_VERSION.tgz" -C .ci/sdk/ai --strip-components=1
          # The extracted packages need their own runtime dependencies.
          (cd .ci/sdk/ai && npm install --omit=dev --ignore-scripts --silent)
          (cd .ci/sdk/coding-agent && npm install --omit=dev --ignore-scripts --silent)

      # The Rust interop test runs cargo build --offline inside npm test;
      # fetch the crates first so the offline build finds them.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml

      - name: Install, link SDK, typecheck, test
        env:
          PI_PACKAGE_DIR: ${{ github.workspace }}/.ci/sdk/coding-agent
          WEBTASKS_PACKAGE_DIR: ${{ github.workspace }}/.ci/pi-webtasks
        run: |
          npm ci --ignore-scripts
          (cd .ci/pi-webtasks && npm ci --ignore-scripts)
          npm run setup:sdk
          npm run typecheck
          npm test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust client conformance kit
        run: cargo test --locked --manifest-path rust/Cargo.toml

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Tarball contains the loadable package
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map(f => f.path);
            const required = ['package.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES',
              'src/pi/index.ts', 'src/bin/coordinator.ts', 'src/bin/host.ts', 'src/bin/agent.ts', 'src/bin/muse.ts'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('missing from tarball:', missing); process.exit(1); }
            console.log('tarball ok:', files.length, 'files');
          "
