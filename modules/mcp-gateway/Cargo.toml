[package]
name = "roger-mcp-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Optional multi-session MCP Streamable HTTP and SSE push gateway for Roger-Wilco"
readme = "README.md"

[workspace]

[[bin]]
name = "roger-mcp-gateway"
path = "src/main.rs"

[features]
# Test-only hooks (--hold-before-ack); release and deploy builds leave them out.
test-hooks = []

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1", "http2"] }

[lints.clippy]
all = "warn"
