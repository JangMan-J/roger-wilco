[package]
name = "roger-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Optional offline verifier of the consumer provenance conventions over a Roger-Wilco audit"
readme = "README.md"

[workspace]

[[bin]]
name = "roger-verify"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
roger-wire = { path = "../../crates/roger-wire" }
serde_json = "1"

[lints.clippy]
all = "warn"
